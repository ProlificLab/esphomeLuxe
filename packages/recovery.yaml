# Muse Luxe recovery package. Included by luxe_microWW.yaml.

api:
  id: api_id
  encryption:
    key: !secret api_encryption_key
  actions:
    - action: clear_conversation_context
      then:
        - lambda: |-
            id(va).reset_conversation_id();
            id(voice_context_reset_count)++;
            id(voice_context_reset_counter).publish_state(
              id(voice_context_reset_count));

wifi:
  id: wifi_id
#  ssid:
#  password:
  power_save_mode: none
  output_power: 15
  ap:
     ssid: "Raspiaudio-luxe"
     password: !secret fallback_ap_password
  on_disconnect:
    - script.execute: enter_offline

# Wi-Fi provisioning remains available over USB; the fallback AP also keeps
# OTA recovery reachable at 192.168.4.1 without embedding a web UI.

improv_serial:  # Disable during debugging to free UART0 for logs

safe_mode:
  boot_is_good_after: 1min
  num_attempts: 5
  reboot_timeout: 10min

globals:
  - id: Vol
    type: float
    initial_value: '0.6'
  - id: phase
    type: int
    initial_value: '0'
  - id: mute
    type: bool
    initial_value: 'false'
  - id: muteH
    type: bool
    initial_value: 'false'
  - id: last_led_phase
    type: int
    initial_value: '-1'
  - id: audio_active
    type: bool
    initial_value: 'false'
  - id: audio_started
    type: bool
    initial_value: 'false'
  - id: initialized
    type: bool
    initial_value: 'false'
  - id: voice_connected
    type: bool
    initial_value: 'false'
  - id: voice_session_failed
    type: bool
    initial_value: 'false'
  - id: privacy_mode
    type: bool
    initial_value: 'false'
  - id: rescue_mode
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: continuous_conversation
    type: bool
    initial_value: 'false'
  - id: ever_voice_connected
    type: bool
    initial_value: 'false'
  - id: last_volume_cmd
    type: float
    initial_value: '-1.0'
  - id: wake_word_count
    type: uint32_t
    initial_value: '0'
  - id: voice_success_count
    type: uint32_t
    initial_value: '0'
  - id: voice_error_count
    type: uint32_t
    initial_value: '0'
  - id: voice_timeout_count
    type: uint32_t
    initial_value: '0'
  - id: voice_reconnect_count
    type: uint32_t
    initial_value: '0'
  - id: voice_recovery_count
    type: uint32_t
    initial_value: '0'
  - id: voice_context_reset_count
    type: uint32_t
    initial_value: '0'
  - id: active_timer_count
    type: uint32_t
    initial_value: '0'
  - id: nearest_timer_total
    type: uint32_t
    initial_value: '0'
  - id: nearest_timer_left
    type: uint32_t
    initial_value: '0'


script:

  - id: set_phase
    mode: restart
    parameters:
      new_phase: int
    then:
      - lambda: id(phase) = new_phase;
      - text_sensor.template.publish:
          id: voice_state
          state: !lambda |-
            switch (new_phase) {
              case ${P_starting}: return {"starting"};
              case ${P_waiting}: return {"waiting"};
              case ${P_playing}: return {"playing"};
              case ${P_listening}: return {"listening"};
              case ${P_answering}: return {"answering"};
              case ${P_offline}: return {"offline"};
              case ${P_error}: return {"error"};
              case ${P_privacy}: return {"privacy"};
              case ${P_rescue}: return {"rescue"};
              default: return {"unknown"};
            }
      - text_sensor.template.publish:
          id: voice_health
          state: !lambda |-
            switch (new_phase) {
              case ${P_waiting}: return {"healthy"};
              case ${P_playing}:
              case ${P_listening}:
              case ${P_answering}: return {"busy"};
              case ${P_offline}: return {"offline"};
              case ${P_error}: return {"degraded"};
              case ${P_privacy}: return {"privacy"};
              case ${P_rescue}: return {"rescue"};
              default: return {"starting"};
            }
      - script.execute: update_led

  - id: initialize_device
    mode: single
    then:
      - delay: 5s
      - lambda: id(my_es8388).setup();
      - lambda: |-
          id(privacy_mode) = id(privacy_mode_switch).state;
          id(initialized) = true;
          id(wake_word_counter).publish_state(id(wake_word_count));
          id(voice_success_counter).publish_state(id(voice_success_count));
          id(voice_error_counter).publish_state(id(voice_error_count));
          id(voice_timeout_counter).publish_state(id(voice_timeout_count));
          id(voice_reconnect_counter).publish_state(id(voice_reconnect_count));
          id(voice_recovery_counter).publish_state(id(voice_recovery_count));
          id(voice_context_reset_counter).publish_state(id(voice_context_reset_count));
          id(active_timer_counter).publish_state(0);
          id(nearest_timer_remaining).publish_state(0);
          id(active_timer_name).publish_state("none");
      - micro_wake_word.stop:
      - microphone.mute: luxe_mic
      - lambda: |-
          id(audio_active) = true;
          id(audio_started) = false;
      - media_player.speaker.play_on_device_media_file:
          media_file: little_sound
          announcement: false
      - script.execute: startup_failsafe

  - id: startup_failsafe
    mode: restart
    then:
      - delay: 8s
      - if:
          condition:
            lambda: 'return id(phase) == ${P_starting};'
          then:
            - lambda: |-
                id(audio_active) = false;
                id(audio_started) = false;
            - script.execute: enter_waiting

  - id: enter_waiting
    mode: restart
    then:
      - script.stop: voice_timeout
      - if:
          condition:
            lambda: 'return id(privacy_mode);'
          then:
            - script.execute: enter_privacy
          else:
            - if:
                condition:
                  lambda: 'return id(rescue_mode);'
                then:
                  - script.execute: enter_rescue_mode
                else:
                  - if:
                      condition:
                        lambda: 'return id(voice_connected);'
                      then:
                        - lambda: |-
                            id(audio_active) = false;
                            id(audio_started) = false;
                        - if:
                            condition:
                              lambda: 'return id(continuous_conversation);'
                            then:
                              - micro_wake_word.stop:
                              - microphone.unmute: luxe_mic
                              - script.execute:
                                  id: set_phase
                                  new_phase: ${P_listening}
                              - voice_assistant.start_continuous:
                            else:
                              - voice_assistant.stop:
                              - microphone.unmute: luxe_mic
                              - micro_wake_word.start:
                              - script.execute:
                                  id: set_phase
                                  new_phase: ${P_waiting}
                      else:
                        - script.execute: enter_offline

  - id: enter_privacy
    mode: restart
    then:
      - script.stop: voice_timeout
      - script.stop: conversation_session_timeout
      - voice_assistant.stop:
      - micro_wake_word.stop:
      - microphone.mute: luxe_mic
      - lambda: id(rescue_media).stop();
      - lambda: |-
          id(privacy_mode) = true;
          id(continuous_conversation) = false;
          id(audio_active) = false;
          id(audio_started) = false;
      - switch.template.publish:
          id: privacy_mode_switch
          state: ON
      - switch.template.publish:
          id: continuous_conversation_switch
          state: OFF
      - script.execute:
          id: set_phase
          new_phase: ${P_privacy}

  - id: enter_offline
    mode: restart
    then:
      - script.stop: voice_timeout
      - voice_assistant.stop:
      - micro_wake_word.stop:
      - microphone.mute: luxe_mic
      - lambda: |-
          id(audio_active) = false;
          id(audio_started) = false;
      - script.execute:
          id: set_phase
          new_phase: ${P_offline}

  - id: recover_voice
    mode: restart
    parameters:
      reason: string
    then:
      - script.stop: voice_timeout
      - lambda: |-
          id(audio_active) = false;
          id(audio_started) = false;
          id(voice_recovery_count)++;
          id(voice_recovery_counter).publish_state(id(voice_recovery_count));
      - text_sensor.template.publish:
          id: last_recovery_reason
          state: !lambda return reason;
      - voice_assistant.stop:
      - media_player.stop: luxe_media_player
      - delay: 250ms
      - script.execute: enter_waiting

  - id: start_manual_listening
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(voice_connected);'
          then:
            - voice_assistant.stop:
            - micro_wake_word.stop:
            - wait_until:
                condition:
                  not:
                    micro_wake_word.is_running:
                timeout: 2s
            - script.execute: mute_off
            - microphone.unmute: luxe_mic
            - lambda: |-
                id(audio_active) = false;
                id(audio_started) = false;
            - script.execute:
                id: set_phase
                new_phase: ${P_listening}
            - voice_assistant.start:
          else:
            - script.execute: enter_offline

  - id: start_continuous_conversation
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(voice_connected) && !id(privacy_mode);'
          then:
            - lambda: id(continuous_conversation) = true;
            - switch.template.publish:
                id: continuous_conversation_switch
                state: ON
            - script.execute: conversation_session_timeout
            - micro_wake_word.stop:
            - microphone.unmute: luxe_mic
            - script.execute:
                id: set_phase
                new_phase: ${P_listening}
            - voice_assistant.start_continuous:
          else:
            - script.execute: enter_offline

  - id: stop_continuous_conversation
    mode: restart
    then:
      - script.stop: conversation_session_timeout
      - lambda: id(continuous_conversation) = false;
      - switch.template.publish:
          id: continuous_conversation_switch
          state: OFF
      - voice_assistant.stop:
      - script.execute: enter_waiting

  - id: conversation_session_timeout
    mode: restart
    then:
      - delay: 5min
      - if:
          condition:
            lambda: 'return id(continuous_conversation);'
          then:
            - script.execute: stop_continuous_conversation

  - id: refresh_timer_status
    mode: restart
    then:
      - lambda: |-
          const auto timers = id(va).get_timers();
          uint32_t count = 0;
          uint32_t nearest_left = UINT32_MAX;
          uint32_t nearest_total = 0;
          std::string nearest_name = "none";
          for (const auto &entry : timers) {
            const auto &timer = entry.second;
            if (!timer.is_active) continue;
            count++;
            if (timer.seconds_left < nearest_left) {
              nearest_left = timer.seconds_left;
              nearest_total = timer.total_seconds;
              nearest_name = timer.name.empty() ? "timer" : timer.name;
            }
          }
          id(active_timer_count) = count;
          id(nearest_timer_left) = count == 0 ? 0 : nearest_left;
          id(nearest_timer_total) = count == 0 ? 0 : nearest_total;
          id(active_timer_counter).publish_state(count);
          id(nearest_timer_remaining).publish_state(id(nearest_timer_left));
          id(active_timer_name).publish_state(nearest_name);
      - if:
          condition:
            lambda: |-
              return id(active_timer_count) > 0 &&
                     id(phase) == ${P_waiting};
          then:
            - light.turn_on:
                id: top_led
                effect: none
                red: !lambda |-
                  if (id(nearest_timer_total) == 0) return 1.0f;
                  const float ratio = (float) id(nearest_timer_left) /
                                      (float) id(nearest_timer_total);
                  return 1.0f - std::min(1.0f, ratio);
                green: !lambda |-
                  if (id(nearest_timer_total) == 0) return 0.0f;
                  const float ratio = (float) id(nearest_timer_left) /
                                      (float) id(nearest_timer_total);
                  return std::min(1.0f, ratio);
                blue: 0%
                brightness: !lambda |-
                  return id(top_led).current_values.get_brightness();
          else:
            - if:
                condition:
                  lambda: |-
                    return id(active_timer_count) == 0 &&
                           id(phase) == ${P_waiting};
                then:
                  - lambda: id(last_led_phase) = -1;
                  - script.execute: update_led

  # Recover locally if a voice/TTS exchange never reaches the normal idle path.
  - id: voice_timeout
    mode: restart
    then:
      - delay: 45s
      - if:
          condition:
            or:
              - voice_assistant.is_running:
              - not:
                  micro_wake_word.is_running:
          then:
            - script.execute: handle_voice_timeout

  # Shared by the real watchdog and the disabled-by-default diagnostic button.
  - id: handle_voice_timeout
    mode: single
    then:
      - script.stop: conversation_session_timeout
      - lambda: |-
          id(voice_session_failed) = true;
          id(continuous_conversation) = false;
          id(voice_timeout_count)++;
          id(voice_timeout_counter).publish_state(id(voice_timeout_count));
      - switch.template.publish:
          id: continuous_conversation_switch
          state: OFF
      - script.execute:
          id: recover_voice
          reason: voice_timeout


  - id: jack_detect_high
    then:
       - logger.log: "Jack detect high -> route to speaker"
       - output.turn_off: dac_mute
       - lambda: |-
           id(my_es8388).write_byte(0x1D, 0x20);
           id(my_es8388).write_byte(0x1C, 0x10);
           id(my_es8388).write_byte(0x04, 0x30);

  - id: jack_detect_low
    then:
       - logger.log: "Jack detect low -> route to line out"
       - output.turn_on: dac_mute
       - lambda: |-
           id(my_es8388).write_byte(0x1D, 0x00);
           id(my_es8388).write_byte(0x1C, 0x00);
           id(my_es8388).write_byte(0x04, 0x0C);

  - id: manual_listen
    then:
      - logger.log: "Manual listen button pressed"
      - if:
          condition:
            lambda: 'return id(mute);'
          then:
            - script.execute: mute_off
            - script.execute: enter_waiting
          else:
            - if:
                condition:
                  lambda: 'return id(phase) == ${P_playing};'
                then:
                  - script.execute: mute_on
                else:
                  - if:
                      condition:
                        lambda: 'return id(phase) == ${P_waiting};'
                      then:
                        - script.execute: start_manual_listening
                      else:
                        - script.execute: enter_waiting

  - id: toggle_audio_mute
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(mute);'
          then:
            - script.execute: mute_off
          else:
            - script.execute: mute_on

  - id: toggle_privacy
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(privacy_mode);'
          then:
            - lambda: id(privacy_mode) = false;
            - switch.template.publish:
                id: privacy_mode_switch
                state: OFF
            - script.execute: enter_waiting
          else:
            - script.execute: enter_privacy

  - id: stop_everything
    mode: restart
    then:
      - media_player.stop: luxe_media_player
      - if:
          condition:
            lambda: 'return id(continuous_conversation);'
          then:
            - script.execute: stop_continuous_conversation
          else:
            - voice_assistant.stop:
            - script.execute: enter_waiting


  - id: update_led
    then:
       - if:
           condition:
             lambda: 'return id(phase) != id(last_led_phase);'
           then:
             - lambda: id(last_led_phase) = id(phase);
             - logger.log: "==>>>update_led"
             - lambda: |-
                   if(id(phase) == ${P_starting}) id(start).execute();
                   if(id(phase) == ${P_waiting}) id(waiting).execute();
                   if(id(phase) == ${P_playing}) id(external_player).execute();
                   if(id(phase) == ${P_listening}) id(listening).execute();
                   if(id(phase) == ${P_answering}) id(answering).execute();
                   if(id(phase) == ${P_offline}) id(offline).execute();
                   if(id(phase) == ${P_error}) id(error).execute();
                   if(id(phase) == ${P_privacy}) id(privacy).execute();
                   if(id(phase) == ${P_rescue}) id(rescue).execute();

  - id: start
    then:
     - light.turn_on:
          id: top_led
          effect: slow_pulse
          red: 80%
          green: 0%
          blue: 80%

  - id: waiting
    then:
     - light.turn_on:
          id: top_led
          effect: pulse
          red: 0%
          green: 0%
          blue: 100%
          brightness: 100%


  - id: listening
    then:
     - light.turn_on:
          id: top_led
          effect: pulse
          red: 0%
          green: 100%
          blue: 0%
          brightness: 100%

  - id: answering
    then:
     - light.turn_on:
          id: top_led
          effect: none
          red: 100%
          green: 100%
          blue: 0%
          brightness: 100%

  - id: external_player
    then:
     - light.turn_on:
          id: top_led
          effect: none
          red: 80%
          green: 40%
          blue: 0%

  - id: offline
    then:
     - light.turn_on:
          id: top_led
          effect: slow_pulse
          red: 100%
          green: 35%
          blue: 0%
          brightness: 45%

  - id: error
    then:
     - light.turn_on:
          id: top_led
          effect: pulse
          red: 100%
          green: 0%
          blue: 0%
          brightness: 100%

  - id: privacy
    then:
     - light.turn_on:
          id: top_led
          effect: none
          red: 100%
          green: 0%
          blue: 0%
          brightness: 35%

  - id: rescue
    then:
     - light.turn_on:
          id: top_led
          effect: pulse
          red: 100%
          green: 15%
          blue: 0%
          brightness: 80%


  - id: mute_on
    then:
       - if:
           condition:
             lambda: 'return fabsf(id(last_volume_cmd)) > 0.005f;'
           then:
             - media_player.volume_set:
                 id: luxe_media_player
                 volume: '0'
             - lambda: id(last_volume_cmd) = 0.0f;
       - lambda: id(mute) = true;

  - id: mute_off
    then:

       - if:
           condition:
             lambda: 'return fabsf(id(last_volume_cmd) - id(Vol)) > 0.005f;'
           then:
             - media_player.volume_set:
                  id: luxe_media_player
                  volume: !lambda return(id(Vol));
             - lambda: id(last_volume_cmd) = id(Vol);
       - lambda: id(mute) = false;

name: Firmware source validation

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Prepare non-production secrets
        run: cp secrets.example.yaml secrets.yaml
      - name: Compile firmware
        run: >-
          docker run --rm
          -v "$PWD":/config
          -w /config
          esphome/esphome@sha256:def6336d7d587f9b056893e86d1cfedfe86db360188221e9f122804872d385b0
          compile luxe_microWW.yaml
      - name: Validate calibration configuration
        run: >-
          docker run --rm
          -v "$PWD":/config
          -w /config
          esphome/esphome@sha256:def6336d7d587f9b056893e86d1cfedfe86db360188221e9f122804872d385b0
          config luxe_microWW_nabu.yaml
      - name: Enforce firmware size budget
        run: scripts/check_firmware_size.sh
      - name: Report firmware memory use
        run: scripts/report_firmware_symbols.sh
      - name: Package firmware and manifest
        run: scripts/package_firmware.sh
      - name: Generate changelog and dependency diff
        env:
          RELEASE_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          args=()
          if [[ -n "$RELEASE_BASE_REF" ]]; then
            args+=(--base "$RELEASE_BASE_REF")
          fi
          python3 scripts/report_release_changes.py "${args[@]}"
          python3 scripts/test_release_report.py
      - name: Verify release metadata and stable rollback guard
        run: |
          version="$(jq -r .version release/manifest-development.json)"
          scripts/verify_release.sh \
            release/manifest-development.json \
            "release/muse-luxe-$version.ota.bin"
          scripts/check_production_manifest.sh
          scripts/check_routine_safety.sh
          scripts/test_routine_safety.sh
          scripts/check_house_intelligence_safety.sh
          scripts/test_house_intelligence_safety.sh
          python3 scripts/check_interpreter_safety.py
          python3 scripts/test_interpreter_safety.py
          python3 scripts/check_offline_rescue_safety.py
          python3 scripts/test_offline_rescue_safety.py
          python3 scripts/test_prepare_rescue_media.py
          python3 scripts/test_proxmox_permissions.py
          python3 scripts/check_opnsense_readonly.py \
            opnsense/muse-readonly/controllers/OPNsense/Muse/Api/StatusController.php \
            opnsense/muse-readonly/models/OPNsense/Muse/ACL/ACL.xml
          python3 scripts/test_opnsense_readonly.py
          python3 scripts/check_frigate_readonly.py
          bash -n scripts/*.sh
          python3 -m py_compile scripts/*.py frigate/*.py
      - name: Upload test build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: muse-luxe-test-firmware
          path: |
            .esphome/build/muse-luxe/.pioenvs/muse-luxe/firmware.ota.bin
            .esphome/build/muse-luxe/.pioenvs/muse-luxe/firmware.map
            firmware-size.txt
            release/**
          retention-days: 7

  release-source:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: compile
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"

substitutions:
  name: muse-luxe
  friendly_name: Raspiaudio Muse Luxe
#States  
  P_starting: "0"
  P_waiting: "1"
  P_playing: "2"
  P_listening: "3"
  P_answering: "4"
  P_offline: "5"
  P_error: "6"
  
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2025.2.0
  name_add_mac_suffix: false
  platformio_options:
    board_build.flash_mode: dio
    board_build.arduino.memory_type: qio_opi
  project:
    name: raspiaudio.voice-assistant
    version: "2025.3.1-hal.7-alpha.2"
  on_boot:
    priority: -100.0
    then:
      - output.turn_on: dac_mute
      - lambda: id(muteH) = true;
      - script.execute:
          id: set_phase
          new_phase: ${P_starting}
      - script.execute: initialize_device
external_components:
    - source:
        type: local
        path: components
      components: [es8388]
        
esp32:
  board: esp-wrover-kit  
  cpu_frequency: 240MHz
  flash_size: 4MB
  partitions: luxe_partitions.csv
  framework:
    type: esp-idf
    version: 5.4.2
    sdkconfig_options:
      CONFIG_ESP_CONSOLE_USB_CDC: "n"
      CONFIG_ESP_CONSOLE_UART_DEFAULT: "y"
      CONFIG_ESP_CONSOLE_UART_NUM: "0"
      CONFIG_ESP_CONSOLE_UART_BAUDRATE: "115200"
       
micro_wake_word:
  id: mww
  microphone: luxe_mic
  stop_after_detection: false
  models:
    - model: https://github.com/kahrendt/microWakeWord/releases/download/okay_nabu_20241226.3/okay_nabu.json
      id: okay_nabu
    - model: https://raw.githubusercontent.com/TaterTotterson/Tater-Wake-Words/740bd31af8f28b1700daf49c36444d278715d298/microWakeWordsV2/okay_hal.json
      id: okay_hal
  on_wake_word_detected:
    - lambda: id(wake_word_count)++;
    - sensor.template.publish:
        id: wake_word_counter
        state: !lambda return id(wake_word_count);
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

ota:                 
  - platform: esphome
    id: ota_esphome
    password: !secret ota_password
  - platform: http_request
    id: ota_http_request
 
update:
  - platform: http_request
    id: update_http_request
    name: Firmware
#    source: https://raw.githubusercontent.com/RASPIAUDIO/raspiaudio.github.io/main/MuseRadio/Homeassistant/manifest_update.json
    source: !secret update_manifest_url
    
http_request:  
    
api:
  id: api_id
  encryption:
    key: !secret api_encryption_key

wifi:
  id: wifi_id
#  ssid: 
#  password: 
  power_save_mode: none
  output_power: 15
  ap:
     ssid: "Raspiaudio-luxe"
     password: !secret fallback_ap_password
  on_disconnect:
    - script.execute: enter_offline

# Wi-Fi provisioning remains available over USB; the fallback AP also keeps
# OTA recovery reachable at 192.168.4.1 without embedding a web UI.
improv_serial:  # Disable during debugging to free UART0 for logs

safe_mode:
  boot_is_good_after: 1min
  num_attempts: 5
  reboot_timeout: 10min

logger:
  level: WARN
  baud_rate: 115200
  hardware_uart: UART0
  logs:
    media_player: WARN

debug:
  update_interval: 60s

##########
# Hardware Configuration
es8388:
   id: my_es8388
   
psram:
  mode: quad
  speed: 80MHz

#######
# Buses Configuration
i2c:
  sda: GPIO18
  scl: GPIO23


#####################
# Internal Components
output:
  - platform: gpio
    id: dac_mute
    pin:
      number: GPIO21
      inverted: true
      mode:
        output: true
  
              
globals:
  - id: Vol
    type: float
    initial_value: '0.6'    
  - id: phase
    type: int
    initial_value: '0'    
  - id: mute  
    type: bool
    initial_value: 'false'        
  - id: muteH 
    type: bool
    initial_value: 'false'     
  - id: last_led_phase
    type: int
    initial_value: '-1'
  - id: audio_active
    type: bool
    initial_value: 'false'
  - id: audio_started
    type: bool
    initial_value: 'false'
  - id: initialized
    type: bool
    initial_value: 'false'
  - id: voice_connected
    type: bool
    initial_value: 'false'
  - id: voice_session_failed
    type: bool
    initial_value: 'false'
  - id: ever_voice_connected
    type: bool
    initial_value: 'false'
  - id: last_volume_cmd
    type: float
    initial_value: '-1.0'
  - id: wake_word_count
    type: uint32_t
    initial_value: '0'
  - id: voice_success_count
    type: uint32_t
    initial_value: '0'
  - id: voice_error_count
    type: uint32_t
    initial_value: '0'
  - id: voice_timeout_count
    type: uint32_t
    initial_value: '0'
  - id: voice_reconnect_count
    type: uint32_t
    initial_value: '0'
  - id: voice_recovery_count
    type: uint32_t
    initial_value: '0'
        
interval:
  - interval: 0.1sec   
    then:          
      - if:
          condition:  
             - speaker.is_stopped:             
          then:
             - if:
                condition:
                  - not:
                     - lambda: 'return(id(muteH));'            
                then:
                  - output.turn_on: dac_mute   
                  - lambda: id(muteH) = true;
                  - logger.log: "====> hardware mute"     
          
      - if:
          condition:  
             - speaker.is_playing:             
          then:
             - if:
                condition:
                  - lambda: 'return(id(muteH));'            
                then:
                  - output.turn_off: dac_mute   
                  - lambda: id(muteH) = false;          
                  - logger.log: "====> hardware unmute"               
     
      - if:
          condition:
            and:
              - lambda: 'return id(audio_active) && !id(audio_started);'
              - speaker.is_playing:
          then:
            - lambda: id(audio_started) = true;
          

sensor:
  - platform: debug
    free:
      name: Heap Free
      entity_category: diagnostic
    block:
      name: Heap Max Block
      entity_category: diagnostic
    loop_time:
      name: Loop Time
      entity_category: diagnostic
    psram:
      name: Free PSRAM
      entity_category: diagnostic
    cpu_frequency:
      name: CPU Frequency
      entity_category: diagnostic
  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 30s
    entity_category: diagnostic
  - platform: uptime
    name: Uptime
    update_interval: 60s
    entity_category: diagnostic
  - platform: adc
    pin: GPIO33
    name: Battery voltage
    device_class: voltage
    unit_of_measurement: "V"
    accuracy_decimals: 2
    state_class: measurement
    entity_category: diagnostic
    update_interval: 15s
    attenuation: auto
    filters:
      - multiply: 2
      - calibrate_linear:
          - 0.0 -> 0.0
          # Map measured full charge to real value to compensate divider/ADC bias
          - 4.58 -> 4.20
      - exponential_moving_average:
             alpha: 0.2
             send_every: 2
      - delta: 0.002
    on_value:
        then:
          - sensor.template.publish:
              id: battery_percent
              state: !lambda |-
                if (x < 3.0f || x > 4.35f) return NAN;
                static const float volts[] = {3.0f, 3.5f, 3.7f, 3.8f, 3.9f, 4.0f, 4.1f, 4.2f};
                static const float percents[] = {0.0f, 2.0f, 7.0f, 18.0f, 40.0f, 65.0f, 90.0f, 100.0f};
                for (size_t i = 1; i < 8; i++) {
                  if (x <= volts[i]) {
                    const float ratio = (x - volts[i - 1]) / (volts[i] - volts[i - 1]);
                    return percents[i - 1] + ratio * (percents[i] - percents[i - 1]);
                  }
                }
                return 100.0f;

  - platform: template
    name: Battery
    id: battery_percent
    device_class: battery
    unit_of_measurement: "%"
    accuracy_decimals: 0
    state_class: measurement
    entity_category: diagnostic
    update_interval: never

  - platform: template
    id: wake_word_counter
    name: Wake Words
    accuracy_decimals: 0
    state_class: total_increasing
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: voice_success_counter
    name: Voice Successes
    accuracy_decimals: 0
    state_class: total_increasing
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: voice_error_counter
    name: Voice Errors
    accuracy_decimals: 0
    state_class: total_increasing
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: voice_timeout_counter
    name: Voice Timeouts
    accuracy_decimals: 0
    state_class: total_increasing
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: voice_reconnect_counter
    name: Voice Reconnects
    accuracy_decimals: 0
    state_class: total_increasing
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: voice_recovery_counter
    name: Voice Recoveries
    accuracy_decimals: 0
    state_class: total_increasing
    entity_category: diagnostic
    update_interval: never

text_sensor:
  - platform: debug
    reset_reason:
      name: Reset Reason
      entity_category: diagnostic
  - platform: template
    id: last_voice_error
    name: Last Voice Error
    entity_category: diagnostic
  - platform: template
    id: voice_state
    name: Voice State
    entity_category: diagnostic
  - platform: template
    id: voice_health
    name: Voice Health
    entity_category: diagnostic
  - platform: template
    id: last_recovery_reason
    name: Last Recovery Reason
    entity_category: diagnostic

button:
  - platform: restart
    name: Restart
    entity_category: diagnostic
    disabled_by_default: true
  - platform: safe_mode
    name: Restart in Safe Mode
    entity_category: diagnostic
    disabled_by_default: true



                  
                   
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO27
      mode:
        input: true
        pullup: true
    id: jack_detect
    name: Jack Detect
    internal: true
    on_press:
      - script.execute: jack_detect_high
    on_release:
      - script.execute: jack_detect_low
  - platform: gpio
    pin:
      number: GPIO19
      inverted: true
      mode:
        input: true
        pullup: true
    name: Volume Up
    on_click:
        - lambda: |-       
                id(Vol) += 0.05;
                if(id(Vol) > 1) id(Vol) = 1;            
        - if:
            condition:
              lambda: 'return fabsf(id(last_volume_cmd) - id(Vol)) > 0.005f;'
            then:
              - media_player.volume_set: 
                  id: luxe_media_player        
                  volume: !lambda return id(Vol);         
              - lambda: id(last_volume_cmd) = id(Vol);
         
  - platform: gpio
    pin:
      number: GPIO32
      inverted: true
      mode:
        input: true
        pullup: true
    name: Volume Down
    on_click:
        - lambda: |-       
                id(Vol) -= 0.05;
                if(id(Vol) < 0) id(Vol) = 0;            
        - if:
            condition:
              lambda: 'return fabsf(id(last_volume_cmd) - id(Vol)) > 0.005f;'
            then:
              - media_player.volume_set: 
                  id: luxe_media_player        
                  volume: !lambda return id(Vol);              
              - lambda: id(last_volume_cmd) = id(Vol);
      
  - platform: gpio
    pin:
      number: GPIO12
      inverted: true
      mode:
        input: true
        pullup: true 
    name: Mute
    on_click:       
      - script.execute: manual_listen
    on_double_click:
       - if:
           condition: 
              - lambda: 'return id(phase) == ${P_playing};'
           then:
              - media_player.stop:                     


light:
  - platform: esp32_rmt_led_strip
    name: None
    id: top_led
    pin: GPIO22
    chipset: WS2812
    num_leds: 1
    rgb_order: grb
#    rmt_channel: 0
    default_transition_length: 0s
    gamma_correct: 2.8
    effects:
      - pulse:
          name: pulse
          transition_length: 250ms
          update_interval: 250ms
      - pulse:
          name: slow_pulse
          transition_length: 1s
          update_interval: 2s

    
i2s_audio:
    id: i2s0
    i2s_lrclk_pin: GPIO25
    i2s_bclk_pin: GPIO5
    i2s_mclk_pin: GPIO0

microphone:
  - platform: i2s_audio
    id: luxe_mic
    i2s_audio_id: i2s0
    sample_rate: 16000
    i2s_din_pin: GPIO35
    bits_per_sample: 16bit
    channel: stereo
    adc_type: external  
    
speaker:
  - platform: i2s_audio
    id: luxe_speaker
    i2s_audio_id: i2s0
    i2s_dout_pin: GPIO26
    dac_type: external
    sample_rate: 48000
    bits_per_sample: 16bit
    num_channels: 2
    buffer_duration: 300ms
    
media_player:
  - platform: speaker
    name: None
    id: luxe_media_player
    internal: false   
#    task_stack_in_psram: true
#    volume_min: 0.5
#    volume_max: 0.8
    announcement_pipeline:
      speaker: luxe_speaker
      format: WAV
      sample_rate: 48000
      num_channels: 1       
    files:
      - id: little_sound
        file: wav/sounds_timer_finished.wav
    on_announcement: 
      - micro_wake_word.stop:
      - wait_until:
          not:
            micro_wake_word.is_running:
      - microphone.mute: luxe_mic
      - lambda: |-
          id(audio_active) = true;
          id(audio_started) = false;
      - if:
           condition:
                lambda: 'return id(phase) != ${P_playing};'
           then:           
              - if:
                  condition:
                    lambda: 'return id(phase) == ${P_waiting};'
                  then:
                    - script.execute:
                        id: set_phase
                        new_phase: ${P_playing}
              - script.execute: mute_off         
                     
    on_idle:
      - script.stop: voice_timeout
      - if:
          condition:
            lambda: |-
              return (id(audio_active) && id(audio_started)) ||
                     id(phase) == ${P_playing};
          then:
            - wait_until:
               and:
                - not:
                    media_player.is_announcing:
                - not:
                    voice_assistant.is_running:    
            - lambda: |-
                id(audio_active) = false;
                id(audio_started) = false;
            - script.execute: enter_waiting
    on_play:
      - if:
          condition:
            lambda: 'return !id(mute);'
          then:
            - output.turn_off: dac_mute
            - lambda: id(muteH) = false;
      - if:
          condition:
            lambda: 'return id(initialized) && id(phase) == ${P_waiting};'
          then:
            - script.execute:
                id: set_phase
                new_phase: ${P_playing}
      
select:
  - platform: template
    name: "Wake word sensitivity"
    optimistic: true
    initial_option: Slightly sensitive
    restore_value: true
    entity_category: config
    options:
      - Slightly sensitive
      - Moderately sensitive
      - Very sensitive
    on_value:
      # Adjust model probability thresholds to tune wake word sensitivity
      lambda: |-
        if (x == "Slightly sensitive") {
          id(okay_nabu).set_probability_cutoff(217);    // 0.85 -> 0.000 FAPH on DipCo
          id(okay_hal).set_probability_cutoff(252);     // 0.99, fewer false accepts
        } else if (x == "Moderately sensitive") {
          id(okay_nabu).set_probability_cutoff(176);    // 0.69 -> 0.376 FAPH on DipCo
          id(okay_hal).set_probability_cutoff(247);     // 0.97, model default
        } else if (x == "Very sensitive") {
          id(okay_nabu).set_probability_cutoff(143);    // 0.56 -> 0.751 FAPH on DipCo
          id(okay_hal).set_probability_cutoff(230);     // 0.90, more permissive
        }


voice_assistant:
  id: va
  microphone: luxe_mic
  media_player: luxe_media_player
  micro_wake_word: mww
  use_wake_word: false
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0

  on_client_connected:
    - lambda: |-
        id(voice_connected) = true;
        if (id(ever_voice_connected)) {
          id(voice_reconnect_count)++;
          id(voice_reconnect_counter).publish_state(id(voice_reconnect_count));
        } else {
          id(ever_voice_connected) = true;
        }
    - if:
        condition:
          lambda: |-
            return id(initialized) &&
                   (id(phase) == ${P_starting} ||
                    id(phase) == ${P_offline} ||
                    id(phase) == ${P_error});
        then:
          - script.execute: enter_waiting

  on_client_disconnected:
    - lambda: id(voice_connected) = false;
    - script.execute: enter_offline
  
  on_listening: 
     - logger.log: "listening 3 => phase"                    
     - lambda: id(voice_session_failed) = false;
     - script.execute: voice_timeout
     - micro_wake_word.stop:
     - script.execute:
         id: set_phase
         new_phase: ${P_listening}

  on_stt_end:
     - light.turn_on:
        id: top_led
        blue: 60%
        red: 20%
        green: 20%
        effect: pulse
      

  on_tts_start:
    - logger.log: "answering  4 => phase"                   
    - micro_wake_word.stop:
    - wait_until:
        not:
          micro_wake_word.is_running:
    - microphone.mute: luxe_mic
    - lambda: |-
        id(audio_active) = true;
        id(audio_started) = false;
    - script.execute:
        id: set_phase
        new_phase: ${P_answering}

  on_end:
    - if:
        condition:
          lambda: 'return !id(voice_session_failed);'
        then:
          - lambda: |-
              id(voice_success_count)++;
              id(voice_success_counter).publish_state(id(voice_success_count));
                     
  on_error:
    - script.stop: voice_timeout
    - lambda: |-
        id(audio_active) = false;
        id(audio_started) = false;
        id(voice_session_failed) = true;
        id(voice_error_count)++;
        id(voice_error_counter).publish_state(id(voice_error_count));
    - text_sensor.template.publish:
        id: last_voice_error
        state: !lambda |-
          return code + ": " + message;
    - logger.log:
        format: "Voice error: %s - %s"
        args: [ 'code.c_str()', 'message.c_str()' ]
        level: WARN
    - script.execute:
        id: set_phase
        new_phase: ${P_error}
    - delay: 3s
    - script.execute:
        id: recover_voice
        reason: voice_error
  

#########
# Scripts

script:   

  - id: set_phase
    mode: restart
    parameters:
      new_phase: int
    then:
      - lambda: id(phase) = new_phase;
      - text_sensor.template.publish:
          id: voice_state
          state: !lambda |-
            switch (new_phase) {
              case ${P_starting}: return {"starting"};
              case ${P_waiting}: return {"waiting"};
              case ${P_playing}: return {"playing"};
              case ${P_listening}: return {"listening"};
              case ${P_answering}: return {"answering"};
              case ${P_offline}: return {"offline"};
              case ${P_error}: return {"error"};
              default: return {"unknown"};
            }
      - text_sensor.template.publish:
          id: voice_health
          state: !lambda |-
            switch (new_phase) {
              case ${P_waiting}: return {"healthy"};
              case ${P_playing}:
              case ${P_listening}:
              case ${P_answering}: return {"busy"};
              case ${P_offline}: return {"offline"};
              case ${P_error}: return {"degraded"};
              default: return {"starting"};
            }
      - script.execute: update_led

  - id: initialize_device
    mode: single
    then:
      - delay: 5s
      - lambda: id(my_es8388).setup();
      - lambda: |-
          id(initialized) = true;
          id(wake_word_counter).publish_state(id(wake_word_count));
          id(voice_success_counter).publish_state(id(voice_success_count));
          id(voice_error_counter).publish_state(id(voice_error_count));
          id(voice_timeout_counter).publish_state(id(voice_timeout_count));
          id(voice_reconnect_counter).publish_state(id(voice_reconnect_count));
          id(voice_recovery_counter).publish_state(id(voice_recovery_count));
      - micro_wake_word.stop:
      - microphone.mute: luxe_mic
      - lambda: |-
          id(audio_active) = true;
          id(audio_started) = false;
      - media_player.speaker.play_on_device_media_file:
          media_file: little_sound
          announcement: false
      - script.execute: startup_failsafe

  - id: startup_failsafe
    mode: restart
    then:
      - delay: 8s
      - if:
          condition:
            lambda: 'return id(phase) == ${P_starting};'
          then:
            - lambda: |-
                id(audio_active) = false;
                id(audio_started) = false;
            - script.execute: enter_waiting

  - id: enter_waiting
    mode: restart
    then:
      - script.stop: voice_timeout
      - if:
          condition:
            lambda: 'return id(voice_connected);'
          then:
            - voice_assistant.stop:
            - microphone.unmute: luxe_mic
            - micro_wake_word.start:
            - lambda: |-
                id(audio_active) = false;
                id(audio_started) = false;
            - script.execute:
                id: set_phase
                new_phase: ${P_waiting}
          else:
            - script.execute: enter_offline

  - id: enter_offline
    mode: restart
    then:
      - script.stop: voice_timeout
      - voice_assistant.stop:
      - micro_wake_word.stop:
      - microphone.mute: luxe_mic
      - lambda: |-
          id(audio_active) = false;
          id(audio_started) = false;
      - script.execute:
          id: set_phase
          new_phase: ${P_offline}

  - id: recover_voice
    mode: restart
    parameters:
      reason: string
    then:
      - script.stop: voice_timeout
      - lambda: |-
          id(audio_active) = false;
          id(audio_started) = false;
          id(voice_recovery_count)++;
          id(voice_recovery_counter).publish_state(id(voice_recovery_count));
      - text_sensor.template.publish:
          id: last_recovery_reason
          state: !lambda return reason;
      - voice_assistant.stop:
      - media_player.stop: luxe_media_player
      - delay: 250ms
      - script.execute: enter_waiting

  - id: start_manual_listening
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(voice_connected);'
          then:
            - voice_assistant.stop:
            - micro_wake_word.stop:
            - wait_until:
                condition:
                  not:
                    micro_wake_word.is_running:
                timeout: 2s
            - script.execute: mute_off
            - microphone.unmute: luxe_mic
            - lambda: |-
                id(audio_active) = false;
                id(audio_started) = false;
            - script.execute:
                id: set_phase
                new_phase: ${P_listening}
            - voice_assistant.start:
          else:
            - script.execute: enter_offline

  # Recover locally if a voice/TTS exchange never reaches the normal idle path.
  - id: voice_timeout
    mode: restart
    then:
      - delay: 45s
      - if:
          condition:
            or:
              - voice_assistant.is_running:
              - not:
                  micro_wake_word.is_running:
          then:
            - lambda: |-
                id(voice_session_failed) = true;
                id(voice_timeout_count)++;
                id(voice_timeout_counter).publish_state(id(voice_timeout_count));
            - script.execute:
                id: recover_voice
                reason: voice_timeout


  - id: jack_detect_high
    then:
       - logger.log: "Jack detect high -> route to speaker"
       - output.turn_off: dac_mute
       - lambda: |-
           id(my_es8388).write_byte(0x1D, 0x20);
           id(my_es8388).write_byte(0x1C, 0x10);
           id(my_es8388).write_byte(0x04, 0x30);

  - id: jack_detect_low
    then:
       - logger.log: "Jack detect low -> route to line out"
       - output.turn_on: dac_mute
       - lambda: |-  
           id(my_es8388).write_byte(0x1D, 0x00);
           id(my_es8388).write_byte(0x1C, 0x00);
           id(my_es8388).write_byte(0x04, 0x0C);

  - id: manual_listen
    then:
      - logger.log: "Manual listen button pressed"
      - if:
          condition:
            lambda: 'return id(mute);'
          then:
            - script.execute: mute_off
            - script.execute: enter_waiting
          else:
            - if:
                condition:
                  lambda: 'return id(phase) == ${P_playing};'
                then:
                  - script.execute: mute_on
                else:
                  - if:
                      condition:
                        lambda: 'return id(phase) == ${P_waiting};'
                      then:
                        - script.execute: start_manual_listening
                      else:
                        - script.execute: enter_waiting


  - id: update_led
    then:  
       - if:
           condition:
             lambda: 'return id(phase) != id(last_led_phase);'
           then:
             - lambda: id(last_led_phase) = id(phase);
             - logger.log: "==>>>update_led" 
             - lambda: |-
                   if(id(phase) == ${P_starting}) id(start).execute();
                   if(id(phase) == ${P_waiting}) id(waiting).execute();
                   if(id(phase) == ${P_playing}) id(external_player).execute();
                   if(id(phase) == ${P_listening}) id(listening).execute();
                   if(id(phase) == ${P_answering}) id(answering).execute();
                   if(id(phase) == ${P_offline}) id(offline).execute();
                   if(id(phase) == ${P_error}) id(error).execute();
                         
  - id: start           
    then:
     - light.turn_on:
          id: top_led
          effect: slow_pulse
          red: 80%
          green: 0%
          blue: 80%             
     
  - id: waiting
    then:
     - light.turn_on:
          id: top_led
          effect: pulse
          red: 0%
          green: 0%
          blue: 100% 
          brightness: 100% 
       

  - id: listening
    then:
     - light.turn_on:
          id: top_led
          effect: pulse
          red: 0%
          green: 100%
          blue: 0%                      
          brightness: 100%       
          
  - id: answering
    then:
     - light.turn_on:
          id: top_led
          effect: none
          red: 100%
          green: 100%
          blue: 0%                     
          brightness: 100%       
          
  - id: external_player
    then:
     - light.turn_on:
          id: top_led
          effect: none
          red: 80%
          green: 40%
          blue: 0%                      

  - id: offline
    then:
     - light.turn_on:
          id: top_led
          effect: slow_pulse
          red: 100%
          green: 35%
          blue: 0%
          brightness: 45%

  - id: error
    then:
     - light.turn_on:
          id: top_led
          effect: pulse
          red: 100%
          green: 0%
          blue: 0%
          brightness: 100%
                      
                        
  - id: mute_on
    then:
       - if:
           condition:
             lambda: 'return fabsf(id(last_volume_cmd)) > 0.005f;'
           then:
             - media_player.volume_set:
                 id: luxe_media_player
                 volume: '0'
             - lambda: id(last_volume_cmd) = 0.0f;
       - lambda: id(mute) = true;
     
  - id: mute_off
    then:

       - if:
           condition:
             lambda: 'return fabsf(id(last_volume_cmd) - id(Vol)) > 0.005f;'
           then:
             - media_player.volume_set:
                  id: luxe_media_player
                  volume: !lambda return(id(Vol));
             - lambda: id(last_volume_cmd) = id(Vol);
       - lambda: id(mute) = false;               
            
      
      
                    

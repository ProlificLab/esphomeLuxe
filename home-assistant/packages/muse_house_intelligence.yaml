input_boolean:
  muse_energy_alerts_enabled:
    name: Muse energy alerts enabled
    icon: mdi:home-lightning-bolt-outline

input_number:
  muse_battery_low_threshold:
    name: Muse battery low threshold
    min: 10
    max: 60
    step: 1
    initial: 30
    unit_of_measurement: "%"
    icon: mdi:battery-low
  muse_battery_critical_threshold:
    name: Muse battery critical threshold
    min: 5
    max: 30
    step: 1
    initial: 15
    unit_of_measurement: "%"
    icon: mdi:battery-alert

rest:
  - resource: "https://192.168.1.1/api/muse/status/gateways"
    method: GET
    authentication: basic
    username: !secret opnsense_muse_api_key
    password: !secret opnsense_muse_api_secret
    verify_ssl: false
    timeout: 10
    scan_interval: 30
    sensor:
      - name: Muse OPNsense gateway feed
        unique_id: muse_opnsense_gateway_feed
        icon: mdi:wan
        value_template: "{{ value_json.status | default('unavailable') }}"
        json_attributes:
          - generated_at
          - gateways

template:
  - sensor:
      - name: Muse house energy status
        unique_id: muse_house_energy_status
        icon: mdi:home-lightning-bolt
        state: >-
          {% set soc = states('sensor.pylontech_charge') %}
          {% if soc in ['unknown', 'unavailable', 'none', ''] %}
            unavailable
          {% elif soc | float(0) <=
                  states('input_number.muse_battery_critical_threshold') | float(15) %}
            critical
          {% elif soc | float(0) <=
                  states('input_number.muse_battery_low_threshold') | float(30) %}
            low
          {% else %}
            normal
          {% endif %}
        attributes:
          battery_soc: "{{ states('sensor.pylontech_charge') }}"
          battery_power_w: "{{ states('sensor.gx_device_dc_battery_power') }}"
          grid_power_w: "{{ states('sensor.gx_device_grid_power_l1') }}"
          solar_power_w: "{{ states('sensor.gx_device_pv_power') }}"
          load_power_w: "{{ states('sensor.gx_device_consumption_power_l1') }}"
          ac_source: "{{ states('sensor.gx_device_ac_active_input_source') }}"
          system_state: "{{ states('sensor.gx_device_system_state') }}"
          connection_entity: >-
            binary_sensor.multiplus_ii_48_5000_70_50_id_276_connected
          connection_state: >-
            {{ states('binary_sensor.multiplus_ii_48_5000_70_50_id_276_connected') }}
          source_entity: sensor.gx_device_grid_power_l1
          source_last_updated: >-
            {% set updates = [
              as_timestamp(states.sensor.pylontech_charge.last_updated, 0)
                if states.sensor.pylontech_charge is defined else 0,
              as_timestamp(states.sensor.gx_device_grid_power_l1.last_updated, 0)
                if states.sensor.gx_device_grid_power_l1 is defined else 0,
              as_timestamp(states.sensor.gx_device_consumption_power_l1.last_updated, 0)
                if states.sensor.gx_device_consumption_power_l1 is defined else 0,
              as_timestamp(states.sensor.gx_device_dc_battery_power.last_updated, 0)
                if states.sensor.gx_device_dc_battery_power is defined else 0
            ] %}
            {% set newest = updates | max %}
            {{ as_datetime(newest).isoformat() if newest > 0 else 'unavailable' }}
          source_age_seconds: >-
            {% set updates = [
              as_timestamp(states.sensor.pylontech_charge.last_updated, 0)
                if states.sensor.pylontech_charge is defined else 0,
              as_timestamp(states.sensor.gx_device_grid_power_l1.last_updated, 0)
                if states.sensor.gx_device_grid_power_l1 is defined else 0,
              as_timestamp(states.sensor.gx_device_consumption_power_l1.last_updated, 0)
                if states.sensor.gx_device_consumption_power_l1 is defined else 0,
              as_timestamp(states.sensor.gx_device_dc_battery_power.last_updated, 0)
                if states.sensor.gx_device_dc_battery_power is defined else 0
            ] %}
            {% set newest = updates | max %}
            {{ ((as_timestamp(now()) - newest) | int) if newest > 0 else -1 }}

      - name: Muse Proxmox status
        unique_id: muse_proxmox_status
        icon: mdi:server-network
        state: >-
          {% set unavailable = ['unknown', 'unavailable', 'none', ''] %}
          {% set node = states('sensor.chuwi_pve_status') %}
          {% set haos = states('sensor.haos_status') %}
          {% set frigate = states('sensor.frigate_status') %}
          {% if node in unavailable or haos in unavailable or frigate in unavailable %}
            unavailable
          {% elif node != 'online' or haos != 'running' or frigate != 'running' %}
            degraded
          {% else %}
            normal
          {% endif %}
        attributes:
          node_status: "{{ states('sensor.chuwi_pve_status') }}"
          node_cpu_percent: "{{ states('sensor.chuwi_pve_cpu_usage') }}"
          node_memory_percent: >-
            {{ states('sensor.chuwi_pve_memory_usage_percentage') }}
          node_disk_gib: "{{ states('sensor.chuwi_pve_disk_usage') }}"
          node_disk_max_gib: "{{ states('sensor.chuwi_pve_max_disk_usage') }}"
          last_backup: "{{ states('sensor.chuwi_pve_last_backup') }}"
          frigate_status: "{{ states('sensor.frigate_status') }}"
          haos_status: "{{ states('sensor.haos_status') }}"
          librenms_status: "{{ states('sensor.librenms_status') }}"
          ollama_status: "{{ states('sensor.ollama_status') }}"
          credential_role: PVEAuditor
          controls_exposed: "{{ false }}"
          source_age_seconds: >-
            {% set updates = [
              as_timestamp(states.sensor.chuwi_pve_cpu_usage.last_updated, 0)
                if states.sensor.chuwi_pve_cpu_usage is defined else 0,
              as_timestamp(
                states.sensor.chuwi_pve_memory_usage_percentage.last_updated, 0)
                if states.sensor.chuwi_pve_memory_usage_percentage is defined else 0,
              as_timestamp(states.sensor.frigate_cpu_usage.last_updated, 0)
                if states.sensor.frigate_cpu_usage is defined else 0,
              as_timestamp(states.sensor.haos_cpu_usage.last_updated, 0)
                if states.sensor.haos_cpu_usage is defined else 0
            ] %}
            {% set newest = updates | max %}
            {{ ((as_timestamp(now()) - newest) | int) if newest > 0 else -1 }}

      - name: Muse Internet status
        unique_id: muse_internet_status
        icon: mdi:wan
        state: >-
          {% set gateways = state_attr(
            'sensor.muse_opnsense_gateway_feed', 'gateways') | default([], true) %}
          {% set online = gateways
            | selectattr('status_translated', 'eq', 'Online') | list | count %}
          {% if not is_state('sensor.muse_opnsense_gateway_feed', 'ok')
                or gateways | count == 0 %}
            unavailable
          {% elif online == 0 %}
            offline
          {% elif online < gateways | count %}
            degraded
          {% else %}
            normal
          {% endif %}
        attributes:
          gateways: >-
            {{ state_attr('sensor.muse_opnsense_gateway_feed', 'gateways')
               | default([], true) }}
          gateway_count: >-
            {{ state_attr('sensor.muse_opnsense_gateway_feed', 'gateways')
               | default([], true) | count }}
          online_count: >-
            {% set gateways = state_attr(
              'sensor.muse_opnsense_gateway_feed', 'gateways')
              | default([], true) %}
            {{ gateways | selectattr('status_translated', 'eq', 'Online')
               | list | count }}
          credential_role: page-muse-readonly
          controls_exposed: "{{ false }}"
          source_generated_at: >-
            {{ state_attr('sensor.muse_opnsense_gateway_feed', 'generated_at')
               | default('unavailable', true) }}
          source_age_seconds: >-
            {% set generated = state_attr(
              'sensor.muse_opnsense_gateway_feed', 'generated_at') %}
            {{ ((as_timestamp(now()) - as_timestamp(generated)) | int)
               if generated else -1 }}

  - binary_sensor:
      - name: Muse Victron data stale
        unique_id: muse_victron_data_stale
        device_class: problem
        icon: mdi:database-clock-outline
        state: >-
          {% set unavailable = ['unknown', 'unavailable', 'none', ''] %}
          {% set updates = [
            as_timestamp(states.sensor.pylontech_charge.last_updated, 0)
              if states.sensor.pylontech_charge is defined else 0,
            as_timestamp(states.sensor.gx_device_grid_power_l1.last_updated, 0)
              if states.sensor.gx_device_grid_power_l1 is defined else 0,
            as_timestamp(states.sensor.gx_device_consumption_power_l1.last_updated, 0)
              if states.sensor.gx_device_consumption_power_l1 is defined else 0,
            as_timestamp(states.sensor.gx_device_dc_battery_power.last_updated, 0)
              if states.sensor.gx_device_dc_battery_power is defined else 0
          ] %}
          {% set newest = updates | max %}
          {{ not is_state(
               'binary_sensor.multiplus_ii_48_5000_70_50_id_276_connected', 'on')
             or states('sensor.pylontech_charge') in unavailable
             or newest == 0
             or as_timestamp(now()) - newest > 300 }}

      - name: Muse Proxmox data stale
        unique_id: muse_proxmox_data_stale
        device_class: problem
        icon: mdi:server-network-off
        state: >-
          {% set unavailable = ['unknown', 'unavailable', 'none', ''] %}
          {% set updates = [
            as_timestamp(states.sensor.chuwi_pve_cpu_usage.last_updated, 0)
              if states.sensor.chuwi_pve_cpu_usage is defined else 0,
            as_timestamp(
              states.sensor.chuwi_pve_memory_usage_percentage.last_updated, 0)
              if states.sensor.chuwi_pve_memory_usage_percentage is defined else 0,
            as_timestamp(states.sensor.frigate_cpu_usage.last_updated, 0)
              if states.sensor.frigate_cpu_usage is defined else 0,
            as_timestamp(states.sensor.haos_cpu_usage.last_updated, 0)
              if states.sensor.haos_cpu_usage is defined else 0
          ] %}
          {% set newest = updates | max %}
          {{ states('sensor.chuwi_pve_status') in unavailable
             or states('sensor.haos_status') in unavailable
             or states('sensor.frigate_status') in unavailable
             or newest == 0
             or as_timestamp(now()) - newest > 300 }}

      - name: Muse OPNsense data stale
        unique_id: muse_opnsense_data_stale
        device_class: problem
        icon: mdi:wan-disconnected
        state: >-
          {% set generated = state_attr(
            'sensor.muse_opnsense_gateway_feed', 'generated_at') %}
          {{ not is_state('sensor.muse_opnsense_gateway_feed', 'ok')
             or not generated
             or as_timestamp(now()) - as_timestamp(generated) > 120 }}

script:
  muse_narrate_house_status:
    alias: Muse - narrate house status
    description: >-
      Read-only deterministic summary built from current Victron and Proxmox
      entities and their freshness. It never calls a writable infrastructure
      entity.
    mode: queued
    max: 5
    fields:
      target:
        required: false
        selector:
          entity:
            filter:
              domain: media_player
    variables:
      target_player: >-
        {{ target | default('media_player.raspiaudio_muse_luxe', true) }}
      energy_summary: >-
        {% if is_state('binary_sensor.muse_victron_data_stale', 'on') %}
          Les données énergétiques Victron sont indisponibles ou sans changement
          de télémétrie depuis plus de cinq minutes; je ne donne pas d'état
          énergétique non vérifié.
        {% else %}
          État énergétique {{ states('sensor.muse_house_energy_status') }}.
          Batterie à
          {{ state_attr('sensor.muse_house_energy_status', 'battery_soc') }} pour
          cent, puissance batterie
          {{ state_attr('sensor.muse_house_energy_status', 'battery_power_w') }}
          watts, solaire
          {{ state_attr('sensor.muse_house_energy_status', 'solar_power_w') }}
          watts, consommation
          {{ state_attr('sensor.muse_house_energy_status', 'load_power_w') }}
          watts et réseau
          {{ state_attr('sensor.muse_house_energy_status', 'grid_power_w') }}
          watts. Source active
          {{ state_attr('sensor.muse_house_energy_status', 'ac_source') }}.
          Dernier changement de télémétrie il y a
          {{ state_attr('sensor.muse_house_energy_status', 'source_age_seconds')
             | int(-1) }} secondes.
        {% endif %}
      proxmox_summary: >-
        {% if is_state('binary_sensor.muse_proxmox_data_stale', 'on') %}
          Les données Proxmox sont indisponibles ou périmées; je ne donne pas
          d'état serveur non vérifié.
        {% else %}
          État Proxmox {{ states('sensor.muse_proxmox_status') }}. Nœud
          {{ state_attr('sensor.muse_proxmox_status', 'node_status') }}, Home
          Assistant {{ state_attr('sensor.muse_proxmox_status', 'haos_status') }},
          Frigate {{ state_attr('sensor.muse_proxmox_status', 'frigate_status') }},
          Libre NMS
          {{ state_attr('sensor.muse_proxmox_status', 'librenms_status') }} et
          Ollama {{ state_attr('sensor.muse_proxmox_status', 'ollama_status') }}.
          CPU du nœud
          {{ state_attr('sensor.muse_proxmox_status', 'node_cpu_percent')
             | float(0) | round(1) }} pour cent, mémoire
          {{ state_attr('sensor.muse_proxmox_status', 'node_memory_percent')
             | float(0) | round(1) }} pour cent. Dernier backup
          {{ state_attr('sensor.muse_proxmox_status', 'last_backup') }}.
        {% endif %}
      internet_summary: >-
        {% if is_state('binary_sensor.muse_opnsense_data_stale', 'on') %}
          Les données du routeur OPNsense sont indisponibles ou périmées; je ne
          donne pas d'état Internet non vérifié.
        {% else %}
          {% set gateways = state_attr(
            'sensor.muse_internet_status', 'gateways') | default([], true) %}
          {% set ns = namespace(parts=[]) %}
          {% for gateway in gateways %}
            {% set ns.parts = ns.parts + [gateway.name ~ ' ' ~
              gateway.status_translated] %}
          {% endfor %}
          État Internet {{ states('sensor.muse_internet_status') }}, avec
          {{ state_attr('sensor.muse_internet_status', 'online_count') }}
          passerelles en ligne sur
          {{ state_attr('sensor.muse_internet_status', 'gateway_count') }}.
          {{ ns.parts | join(', ') }}.
        {% endif %}
    sequence:
      - action: script.muse_announce
        data:
          message: >-
            {{ energy_summary }} {{ proxmox_summary }} {{ internet_summary }}
          targets: "{{ [target_player] }}"
          priority: normal

automation:
  - id: muse_energy_battery_alert
    alias: Muse - announce low or critical battery
    triggers:
      - trigger: state
        entity_id: sensor.muse_house_energy_status
        to: low
        for: "00:02:00"
      - trigger: state
        entity_id: sensor.muse_house_energy_status
        to: critical
        for: "00:02:00"
    conditions:
      - condition: state
        entity_id: input_boolean.muse_energy_alerts_enabled
        state: "on"
      - condition: state
        entity_id: binary_sensor.muse_victron_data_stale
        state: "off"
    actions:
      - action: script.muse_announce_everywhere
        data:
          message: >-
            Alerte énergie. La batterie est à
            {{ state_attr('sensor.muse_house_energy_status', 'battery_soc') }}
            pour cent. État {{ states('sensor.muse_house_energy_status') }}.
          priority: urgent
    mode: single

  - id: muse_energy_recovered
    alias: Muse - announce battery recovery
    triggers:
      - trigger: state
        entity_id: sensor.muse_house_energy_status
        from:
          - low
          - critical
        to: normal
        for: "00:05:00"
    conditions:
      - condition: state
        entity_id: input_boolean.muse_energy_alerts_enabled
        state: "on"
    actions:
      - action: script.muse_announce_everywhere
        data:
          message: >-
            Le niveau de batterie est revenu à
            {{ state_attr('sensor.muse_house_energy_status', 'battery_soc') }}
            pour cent. L'état énergétique est de nouveau normal.
          priority: normal
    mode: single
